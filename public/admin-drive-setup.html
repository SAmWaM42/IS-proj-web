<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Animal Agent — temporary Drive setup</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 640px; margin: 4rem auto; padding: 0 1rem; line-height: 1.5; }
    label, input, button { display: block; width: 100%; box-sizing: border-box; }
    input { margin: .5rem 0 1rem; padding: .7rem; }
    button { padding: .8rem; cursor: pointer; }
    #status { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Animal Agent Drive setup</h1>
  <p>Temporary administrator-only page. Enter the setup key configured in Vercel. It is sent to the backend over HTTPS and is not saved in this page.</p>
  <form id="setup">
    <label for="secret">Administrator setup key</label>
    <input id="secret" name="secret" type="password" autocomplete="current-password" required>
    <button type="submit">Connect Google Drive</button>
  </form>
  <p id="status" role="status"></p>
  <script>
    const form = document.getElementById("setup");
    const statusNode = document.getElementById("status");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = form.querySelector("button");
      button.disabled = true;
      statusNode.textContent = "Starting Google authorization…";
      try {
        const response = await fetch("/api/admin/google/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ setup_secret: document.getElementById("secret").value })
        });
        const result = await response.json();
        if (!response.ok || !result.authorization_url) {
          throw new Error(result.error || "Could not start Google authorization.");
        }
        document.getElementById("secret").value = "";
        window.location.assign(result.authorization_url);
      } catch (error) {
        statusNode.textContent = error instanceof Error ? error.message : "Setup failed.";
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
